# No official public HA blueprint schema exists; SchemaStore selects Torque.
# yaml-language-server: $schema=none

blueprint:
  name: Оновлення Telegram-сенсорів Scrape
  description: >-
    Примусово оновлює вибрані сенсори Scrape кожні 5 або 10 секунд. За бажанням
    оновлює їх лише під час активної небезпеки за даними Ukraine Alarm.
  domain: automation
  author: Denys Dovhan
  source_url: >-
    https://github.com/denysdovhan/ha-aerial-danger/blob/main/blueprints/telegram_scrape_refresh.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    scrape_sensors:
      name: Telegram-сенсори Scrape
      description: >-
        Виберіть один або кілька сенсорів Scrape, які читають Telegram-канали.
      selector:
        entity:
          multiple: true
          filter:
            - integration: scrape
              domain: sensor
    refresh_interval:
      name: Інтервал оновлення
      description: Як часто оновлювати вибрані сенсори Scrape.
      default: "/5"
      selector:
        select:
          options:
            - label: Кожні 5 секунд
              value: "/5"
            - label: Кожні 10 секунд
              value: "/10"
    ukraine_alarm_sensors:
      name: Сенсори Ukraine Alarm
      description: >-
        Необов’язково. Виберіть сенсор безпеки «Повітряна тривога» для кожного
        регіону Ukraine Alarm. Оновлення виконуватиметься, доки хоча б один
        вибраний сенсор активний.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - integration: ukraine_alarm
              domain: binary_sensor
              device_class: safety

variables:
  ukraine_alarm_sensors: !input ukraine_alarm_sensors

triggers:
  - trigger: time_pattern
    seconds: !input refresh_interval

conditions:
  - condition: template
    value_template: >-
      {{ not ukraine_alarm_sensors
         or expand(ukraine_alarm_sensors)
           | selectattr('state', 'eq', 'on')
           | list
           | count > 0 }}

actions:
  - action: homeassistant.update_entity
    target:
      entity_id: !input scrape_sensors

mode: restart
